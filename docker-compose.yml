services:
  backend:
    build:
      context: ./backend
    container_name: emermedica-backend
    env_file:
      - path: ./backend/.env
        required: false
    ports:
      - "8010:8000"
    volumes:
      - backend_logs:/app/logs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8010/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s


  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8000
    container_name: emermedica-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  backend_logs: